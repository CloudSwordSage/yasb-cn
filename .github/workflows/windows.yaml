name: Windows build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14'

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            python_arch: x64
            artifact_suffix: x64
          - arch: arm64
            runner: windows-11-arm
            python_arch: arm64
            artifact_suffix: aarch64
    runs-on: ${{ matrix.runner }}
    name: Build (${{ matrix.arch }})
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        architecture: ${{ matrix.python_arch }}

    - name: Create virtual environment
      run: |
        python -m venv venv
      shell: pwsh

    - name: Activate virtual environment and install dependencies
      run: |
        .\venv\Scripts\Activate
        python -m pip install --upgrade pip
        pip install --force --no-cache .[packaging]
      shell: pwsh

    - name: Build EXE
      run: |
        .\venv\Scripts\Activate
        cd src
        python build.py build
      shell: pwsh

    - name: Build MSI
      run: |
        .\venv\Scripts\Activate
        cd src
        python build.py bdist_msi
      shell: pwsh

    - name: Upload Built MSI
      uses: actions/upload-artifact@v7
      with:
        name: built-msi-${{ matrix.artifact_suffix }}
        path: src/dist/out/*.msi

  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Create virtual environment
      run: |
        python -m venv venv
      shell: pwsh

    - name: Download all MSI artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: built-msi-*
        path: dist-msis
        merge-multiple: true

    - name: Get App Info
      id: get_version
      run: |
        .\venv\Scripts\Activate
        $version = (Get-Content src/settings.py | Select-String -Pattern 'BUILD_VERSION\s*=\s*"([^"]+)"').Matches.Groups[1].Value
        echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      shell: pwsh
      
    - name: Create Tag
      id: create_tag
      uses: actions/github-script@v9
      with:
        github-token: ${{ github.token }}
        script: |
          const version = `v${process.env.VERSION}`;
          const { owner, repo } = context.repo;
          const sha = context.sha;
          try {
            const { data: tags } = await github.rest.repos.listTags({
              owner,
              repo,
            });
            const tagExists = tags.some(tag => tag.name === version);
            if (!tagExists) {
              console.log(`Creating tag ${version}`);
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${version}`,
                sha,
              });
            } else {
              console.log(`Tag ${version} already exists, skipping tag creation`);
            }
          } catch (error) {
            console.error(`Error fetching tags: ${error.message}`);
            throw error;
          }

    - name: Fetch all tags
      run: git fetch --tags
      shell: pwsh

    - name: Compute Commit Range
      id: commit_range
      shell: pwsh
      run: |
        $currentTag = "v${{ steps.get_version.outputs.VERSION }}"
        $prevTag = (git tag --sort=-version:refname | Where-Object { $_ -ne $currentTag } | Select-Object -First 1)
        if ([string]::IsNullOrWhiteSpace($prevTag)) {
          $prevTag = (git describe --tags --abbrev=0 2>$null)
        }
        if ([string]::IsNullOrWhiteSpace($prevTag)) {
          $range = "HEAD"
        } else {
          $range = "$prevTag..$currentTag"
        }
        "range=$range" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Create Changelog
      id: changelog
      uses: actions/github-script@v9
      env:
        COMMIT_RANGE: ${{ steps.commit_range.outputs.range }}
      with:
        script: |
          const { execSync } = require('child_process');
          const path = require('path');
          
          const configPath = path.resolve(process.env.GITHUB_WORKSPACE, '.github/changelog/changelog.js');
          const config = require(configPath);
          
          const range = process.env.COMMIT_RANGE;
          const cmd = range === 'HEAD' 
            ? 'git log --pretty=format:"%H|%s"' 
            : `git log ${range} --pretty=format:"%H|%s"`;
            
          const log = execSync(cmd).toString('utf-8').trim();
          if (!log) {
            core.setOutput('changes', '');
            return;
          }
          
          const commits = log.split('\n').map(line => {
            const idx = line.indexOf('|');
            return {
              hash: line.slice(0, idx),
              subject: line.slice(idx + 1)
            };
          });
          
          const parsedCommits = [];
          for (const c of commits) {
            if (c.subject.startsWith('chore(schema):') || c.subject.startsWith('chore(version):')) continue;
            
            const match = c.subject.match(/^([a-zA-Z]+)(?:\([^)]+\))?!?: /);
            const type = match ? match[1].toLowerCase() : 'other';
            const subjectDesc = match ? c.subject.slice(match[0].length) : c.subject;
            parsedCommits.push({
              type,
              subject: subjectDesc,
              url: `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${c.hash}`
            });
          }
          
          const grouped = {};
          for (const c of parsedCommits) {
            const typeConfig = config.types.find(t => t.types.includes(c.type));
            const label = typeConfig ? typeConfig.label : 'Other Changes';
            if (!grouped[label]) grouped[label] = [];
            grouped[label].push(c);
          }
          
          let changelog = '';
          const labels = config.types.map(t => t.label);
          if (!labels.includes('Other Changes')) labels.push('Other Changes');
          
          for (const label of labels) {
            if (grouped[label] && grouped[label].length > 0) {
              changelog += config.renderTypeSection(label, grouped[label]);
            }
          }
          
          core.setOutput('changes', changelog.trim());

    - name: Generate Checksum
      run: |
        .\venv\Scripts\Activate
        $checksums = Get-FileHash dist-msis/*.msi -Algorithm SHA256
        $output = @()
        foreach ($checksum in $checksums) {
          $filename = [System.IO.Path]::GetFileName($checksum.Path)
          $output += "$($checksum.Hash) $filename"
        }
        $output -join "`n" > dist-msis/checksums.txt
      shell: pwsh

    - name: Create and Upload Release
      id: create_release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ steps.get_version.outputs.VERSION }}
        name: v${{ steps.get_version.outputs.VERSION }}
        body: | 
              ${{ steps.changelog.outputs.changes }}
        append_body: true
        files: |
          dist-msis/*.msi
          dist-msis/checksums.txt
        prerelease: false
        generate_release_notes: true
        draft: true
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Install dependencies for schema generation
      run: |
        .\venv\Scripts\Activate
        pip install --force --no-cache .
      shell: pwsh

    - name: Generate schema.json
      run: |
        .\venv\Scripts\Activate
        python src/core/validation/export_schema.py
      shell: pwsh

    - name: Commit schema.json
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add schema.json
        git diff --cached --quiet || git commit -m "chore(schema): update schema.json for v${{ steps.get_version.outputs.VERSION }}"
        git push
      shell: pwsh

    - name: Bump Version for Next Development Cycle
      run: |
        .\venv\Scripts\Activate
        $version = "${{ steps.get_version.outputs.VERSION }}"
        $parts = $version.Split('.')
        $major = [int]$parts[0]
        $minor = [int]$parts[1]
        $patch = [int]$parts[2]
        
        $patch += 1
        if ($patch -ge 10) {
            $patch = 0
            $minor += 1
            if ($minor -ge 10) {
                $minor = 0
                $major += 1
            }
        }
        $nextVersion = "$major.$minor.$patch"
        
        $settingsPath = "src/settings.py"
        $content = Get-Content $settingsPath -Raw
        $content = $content -replace "BUILD_VERSION = `"$version`"", "BUILD_VERSION = `"$nextVersion`""
        Set-Content -Path $settingsPath -Value $content -NoNewline
        
        git add $settingsPath
        git diff --cached --quiet || git commit -m "chore(version): bump to $nextVersion for next development cycle"
        git push
      shell: pwsh
