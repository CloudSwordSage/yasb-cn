name: Build Preview Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14'

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            python_arch: x64
            artifact_suffix: x64
          - arch: arm64
            runner: windows-11-arm
            python_arch: arm64
            artifact_suffix: aarch64
    runs-on: ${{ matrix.runner }}
    name: Build (${{ matrix.arch }})
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        architecture: ${{ matrix.python_arch }}

    - name: Create virtual environment
      run: |
        python -m venv venv
      shell: pwsh

    - name: Get App Info
      id: get_info
      run: |
        .\venv\Scripts\Activate
        $currentDateTime = Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC"
        echo "BUILD_DATETIME=$currentDateTime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        $commitHash = git rev-parse --short HEAD
        echo "COMMIT_HASH=$commitHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        # Also expose as step outputs for use in later expression fields
        echo "BUILD_DATETIME=$currentDateTime" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        echo "COMMIT_HASH=$commitHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      shell: pwsh

    - name: Update Release Channel
      run: |
        .\venv\Scripts\Activate
        $settingsPath = "src/settings.py"
        $content = Get-Content $settingsPath -Raw
        $replacement = 'RELEASE_CHANNEL = "preview-' + $env:COMMIT_HASH + '"'
        $content = $content -replace 'RELEASE_CHANNEL = "stable"', $replacement
        Set-Content -Path $settingsPath -Value $content -NoNewline
        Write-Host "Updated RELEASE_CHANNEL to preview-$env:COMMIT_HASH"
      shell: pwsh

    - name: Install dependencies
      run: |
        .\venv\Scripts\Activate
        python -m pip install --upgrade pip
        pip install --force --no-cache .[packaging]
      shell: pwsh

    - name: Build EXE
      run: |
        .\venv\Scripts\Activate
        cd src
        python build.py build
      shell: pwsh

    - name: Upload unsigned EXE artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.unsigned_exe_name }}
        path: |
          src/dist/yasb.exe
          src/dist/yasbc.exe
          src/dist/yasb_themes.exe
          src/dist/yasb_cloud.exe

    - name: Build MSI
      run: |
        .\venv\Scripts\Activate
        cd src
        python build.py bdist_msi
      shell: pwsh

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: yasb-preview-${{ steps.get_info.outputs.COMMIT_HASH }}-${{ matrix.artifact_suffix }}
        path: |
          src/dist/out/*.msi
        retention-days: 10

  publish_preview_release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: ${{ github.ref }}

    - name: Set release metadata
      id: release_info
      run: |
        currentDateTime=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
        echo "BUILD_DATETIME=$currentDateTime" >> "$GITHUB_ENV"
        commitHash=$(git rev-parse --short HEAD)
        baseVersion=$(grep 'BUILD_VERSION' src/settings.py | cut -d'"' -f2)
        echo "COMMIT_HASH=$commitHash" >> "$GITHUB_ENV"
        echo "BASE_VERSION=$baseVersion" >> "$GITHUB_ENV"
        echo "COMMIT_HASH=$commitHash" >> "$GITHUB_OUTPUT"
        echo "BASE_VERSION=$baseVersion" >> "$GITHUB_OUTPUT"

    - name: Generate Changelog
      run: |
        latestVersionTag=$(git tag --sort=-version:refname | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+" | head -n 1 || true)
        if [ -n "$latestVersionTag" ]; then
          commits=$(git log "$latestVersionTag..HEAD" --pretty=format:"* %s %h" --no-merges | grep -vE "^\* chore\((schema|version)\):" || true)
        else
          commits=$(git log -n 20 --pretty=format:"* %s %h" --no-merges | grep -vE "^\* chore\((schema|version)\):" || true)
        fi
        if [ -z "$commits" ]; then
          if [ -n "$latestVersionTag" ]; then
            commits="* No significant changes detected since $latestVersionTag"
          else
            commits="* No significant changes detected"
          fi
        fi
        printf '%s\n' "$commits" > CHANGELOG.md

    - name: Download MSI artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: yasb-preview-*
        path: artifacts
        merge-multiple: true

    - name: Generate Checksums
      run: |
        cd artifacts
        sha256sum *.msi > checksums.txt

    - name: Delete existing preview release
      run: |
        gh release delete preview --yes || true
        git tag -d preview || true
        git push origin :refs/tags/preview || true
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        name: YASB ${{ steps.release_info.outputs.BASE_VERSION }} Preview (${{ steps.release_info.outputs.COMMIT_HASH }})
        tag_name: preview
        prerelease: true
        files: |
          artifacts/*.msi
          artifacts/checksums.txt
        body_path: CHANGELOG.md
